name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  # ---------------------------------------------------------------------------
  # 1. Test — lint, type-check, migrations, pytest
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: pip-audit (vulnerability scan)
        run: pip-audit -r backend/requirements.txt

      - name: ruff lint + format check
        run: |
          ruff check backend
          ruff format --check backend

      - name: mypy type check
        run: mypy backend/app

      - name: Alembic migrations
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
        run: alembic -c backend/alembic.ini upgrade head

      - name: pytest
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          APP_SECRET_KEY: test-secret-ci
          JWT_SECRET_KEY: test-jwt-secret-ci-long-enough-to-be-valid-padding-here
        run: |
          pytest backend/tests \
            --cov=backend/app \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            -v

  # ---------------------------------------------------------------------------
  # 2. Secret scanning
  # ---------------------------------------------------------------------------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@c8fb49f14e1ff2c0d4e40e7fcf25e406cc0e971  # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. Build multi-arch image, scan, promote to :stable
  # Only on pushes to main (not on PRs)
  # ---------------------------------------------------------------------------
  image:
    needs: [test, gitleaks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-qemu-action@29109295f81e9208d7d0f9f73588ec1ea9eed7d6  # v3.6.0

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b8c7b24f  # v3.10.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker layer cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - uses: docker/build-push-action@1dc73b7af8ac95cc37e4a6ff55bd7e8c19e9e5eb  # v6.17.0
        id: build
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Move cache (avoids unbounded growth)
      - run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Promote to :stable (only after scan passes)
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:stable \
            ${{ env.IMAGE }}:${{ github.sha }}
