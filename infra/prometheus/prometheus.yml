global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: conversx-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: conversx-worker
    static_configs:
      - targets: ["worker:9091"]   # worker exposes metrics on secondary port
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
