# =============================================================================
# ConversX Nginx Reverse Proxy Configuration (Oracle Cloud VM)
# Production Hardened (Phase 7):
# - TLS 1.2 & 1.3 with modern secure cipher suites
# - Automated Let's Encrypt / Certbot renewal via webroot ACME challenge
# - Security headers (HSTS, CSP, X-Frame-Options, X-Content-Type-Options, Permissions-Policy)
# - Fine-grained rate limiting (audio uploads, auth, general API)
# - 25 MB payload limit for voice uploads; strict timeouts
# - Internal-service isolation: blocks external /metrics and hidden files
# =============================================================================

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Buffer & request limits
    client_max_body_size 25M;
    client_body_buffer_size 1M;
    client_header_buffer_size 4k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Hide Nginx version
    server_tokens off;

    # Rate limiting zones (keyed by client IP)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_audio:10m rate=2r/s;
    limit_req_status 429;

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_api {
        server api:8000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP -> HTTPS Redirect & ACME Challenge
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.conversx.com conversx.com;

        # Let's Encrypt ACME renewal challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # 301 Permanent Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS Production Gateway (api.conversx.com)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.conversx.com conversx.com;

        # SSL Certificates (managed via Certbot / Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/api.conversx.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.conversx.com/privkey.pem;

        # Modern TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Production Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.conversx.com https://firestore.googleapis.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

        # Protect against hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Block external access to Prometheus internal metrics
        location /metrics {
            return 403 "Forbidden: Prometheus metrics are internal-only.
";
            add_header Content-Type text/plain;
        }

        # ACME Challenge on HTTPS if needed
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Health checks (unthrottled for automated uptime monitoring)
        location = /healthz {
            proxy_pass http://backend_api/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /api/v1/health {
            proxy_pass http://backend_api/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Stricter Rate Limiting on Voice Audio Uploads (2 req/s with burst of 4)
        location = /api/v1/practice/voice/analyze-audio {
            limit_req zone=api_audio burst=4 nodelay;

            client_max_body_size 25M;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Rate Limiting on Authentication Endpoints (5 req/s with burst of 10)
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # Main API Gateway
        location / {
            limit_req zone=api_general burst=30 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
